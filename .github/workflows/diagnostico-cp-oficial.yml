name: Diagnosticar fonte oficial CP
on:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar recursos publicos da CP sem alterar a app
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, html
          from urllib.parse import urljoin, urlparse
          pages={"CP inicio":"https://www.cp.pt/pt","CP tempo real":"https://www.cp.pt/info/w/realtime"}
          for name,url in pages.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read(400000).decode("utf-8","replace")
                print(json.dumps({"pagina":name,"http":response.status,"url_final":response.url,"tipo":response.headers.get("Content-Type"),"bytes":len(body)},ensure_ascii=False))
                resources=re.findall(r'(?:src|href)\\s*=\\s*["\\\']([^"\\\']+)["\\\']',body,re.I)
                candidates=[]
                for item in resources:
                  absolute=urljoin(response.url,html.unescape(item))
                  host=urlparse(absolute).hostname or ""
                  if host.endswith("cp.pt") and (".js" in absolute or any(k in absolute.lower() for k in ("realtime","tempo-real","api","comboio","train"))):
                    if absolute not in candidates:candidates.append(absolute)
                print(json.dumps({"pagina":name,"recursos_candidatos":candidates[:35]},ensure_ascii=False))
                print(json.dumps({"pagina":name,"marcadores":{term:term.lower() in body.lower() for term in ["fetch(","XMLHttpRequest","graphql","api/","próximos comboios","next trains"]}},ensure_ascii=False))
            except Exception as e:print(json.dumps({"pagina":name,"erro":str(e)[:180]},ensure_ascii=False))
          print("DIAGNOSTICO APENAS: nao prova que exista API publica nem acesso autorizado a GPS.")
          PY
