name: Diagnostico fontes CP e FT
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar fontes CP e Fertagus
        run: node scripts/diagnostico-fontes.mjs
