name: RJP Train Live - Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build WebApp
        run: npm run build

      - name: Upload WebApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-V2.3-WebApp
          path: dist/
          if-no-files-found: error
