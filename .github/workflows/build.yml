name: RJP Train Live - Web + Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build WebApp
        env:
          VITE_API_URL: ${{ vars.RJP_API_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-Web-V2.7.0
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build WebApp
        env:
          VITE_API_URL: ${{ vars.RJP_API_URL }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase for Android push
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Firebase não configurado: define GOOGLE_SERVICES_JSON_B64 no GitHub Secrets" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PYGRADLE'
          from pathlib import Path
          top=Path('android/build.gradle')
          s=top.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
          top.write_text(s)
          app=Path('android/app/build.gradle')
          s=app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PYGRADLE

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply RJP Train Live icon safely
        shell: bash
        run: |
          set -e
          SRC="native-icons/android/res"
          DST="android/app/src/main/res"

          # Keep Capacitor's resources and overlay IconKitchen resources.
          if [ -d "$SRC" ]; then
            cp -R "$SRC"/. "$DST"/
          fi

          # Use the guaranteed main launcher resource also for roundIcon.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@mipmap/ic_launcher"#g' "$MANIFEST"

          echo "Launcher references:"
          grep -n "android:icon\\|android:roundIcon" "$MANIFEST" || true
          echo "Launcher resources:"
          find "$DST" -type f -name 'ic_launcher*' -print | sort || true

      - name: Ensure Android notification permission
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if perm not in s:
              s=s.replace('<application',perm+'\n    <application',1)
          p.write_text(s)
          PYANDROID

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-V2.7.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
