name: RJP Train Live - Web + Android APK

on:
  push:
    branches: [main, master, fix/ota-download-diagnostics]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Compilar WebApp
        env:
          VITE_API_URL: ${{ vars.RJP_API_URL }}
          VITE_OTA_MANIFEST_URL: ${{ vars.VITE_OTA_MANIFEST_URL }}
        run: npm run build
      - name: Disponibilizar WebApp
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-Web-V2.12
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm install
      - name: Compilar WebApp
        env:
          VITE_API_URL: ${{ vars.RJP_API_URL }}
          VITE_OTA_MANIFEST_URL: ${{ vars.VITE_OTA_MANIFEST_URL }}
        run: npm run build
      - name: Criar projeto Android
        run: npx cap add android
      - name: Configurar Firebase Android
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo '::error::Falta GOOGLE_SERVICES_JSON_B64'; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PYGRADLE'
          from pathlib import Path
          top = Path('android/build.gradle')
          s = top.read_text()
          if 'com.google.gms:google-services' not in s:
              s = s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
          top.write_text(s)
          app = Path('android/app/build.gradle')
          s = app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PYGRADLE
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Aplicar icone RJP Train Live
        shell: bash
        run: |
          set -euo pipefail
          SRC="native-icons/android/res"
          DST="android/app/src/main/res"
          if [ -d "$SRC" ]; then
            cp -R "$SRC"/. "$DST"/
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@mipmap/ic_launcher"#g' "$MANIFEST"
      - name: Garantir permissao de notificacoes
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s)
          PYANDROID
      - name: Configurar assinatura Release permanente
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RJP_KEYSTORE_B64: ${{ secrets.RJP_KEYSTORE_B64 }}
          RJP_KEYSTORE_PASSWORD: ${{ secrets.RJP_KEYSTORE_PASSWORD }}
          RJP_KEY_PASSWORD: ${{ secrets.RJP_KEY_PASSWORD }}
          RJP_KEY_ALIAS: ${{ secrets.RJP_KEY_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for key in RJP_KEYSTORE_B64 RJP_KEYSTORE_PASSWORD RJP_KEY_PASSWORD RJP_KEY_ALIAS; do
            test -n "${!key:-}" || { echo "::error::Falta o Secret $key"; exit 1; }
          done
          printf '%s' "$RJP_KEYSTORE_B64" | base64 --decode > android/app/rjp-release.jks
          keytool -list -keystore android/app/rjp-release.jks -storepass "$RJP_KEYSTORE_PASSWORD" -alias "$RJP_KEY_ALIAS" >/dev/null
          python3 - <<'PYSIGN'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'buildTypes {' not in s or 'release {' not in s:
              raise RuntimeError('Estrutura Gradle inesperada')
          signing = """signingConfigs {
              rjpRelease {
                  storeFile file('rjp-release.jks')
                  storePassword System.getenv('RJP_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('RJP_KEY_ALIAS')
                  keyPassword System.getenv('RJP_KEY_PASSWORD')
              }
          }
          buildTypes {"""
          s = s.replace('buildTypes {', signing, 1)
          s = s.replace('release {', 'release {\n            signingConfig signingConfigs.rjpRelease', 1)
          version_code = 212000 + int(os.environ['RUN_NUMBER'])
          s, n = re.subn(r'\bversionCode\s+\d+', f'versionCode {version_code}', s, count=1)
          if n != 1:
              raise RuntimeError('versionCode nao encontrado')
          s, n = re.subn(r'\bversionName\s+["\'][^"\']+["\']', 'versionName "2.12.0"', s, count=1)
          if n != 1:
              raise RuntimeError('versionName nao encontrado')
          p.write_text(s)
          print(f'Android versionCode: {version_code}')
          PYSIGN
      - name: Expor motivo real de erro do Capgo no diagnostico OTA
        shell: bash
        run: |
          python3 - <<'PYCAPGO'
          from pathlib import Path
          root = Path('node_modules/@capgo/capacitor-updater/android/src/main/java')
          matches = list(root.rglob('CapacitorUpdaterPlugin.java'))
          if len(matches) != 1:
              raise RuntimeError(f'Esperado um plugin Capgo, encontrados: {len(matches)}')
          p = matches[0]
          s = p.read_text()
          old = 'call.reject("Failed to download from: " + url, e);'
          new = 'call.reject("Failed to download from: " + url + " | Cause: " + e.getClass().getSimpleName() + ": " + e.getMessage(), e);'
          count = s.count(old)
          if count < 1:
              raise RuntimeError('Assinatura de erro Capgo nao encontrada; verificar versao do plugin')
          p.write_text(s.replace(old, new))
          print(f'Capgo: {count} mensagens de erro nativo detalhadas')
          PYCAPGO
      - name: Compilar APK Release assinada
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          RJP_KEYSTORE_PASSWORD: ${{ secrets.RJP_KEYSTORE_PASSWORD }}
          RJP_KEY_PASSWORD: ${{ secrets.RJP_KEY_PASSWORD }}
          RJP_KEY_ALIAS: ${{ secrets.RJP_KEY_ALIAS }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Verificar certificado da APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo '::error::apksigner nao encontrado'; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo 'Comparar SHA-256 com APK instalada ANTES de instalar.'
      - name: Disponibilizar APK Release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-V2.12-OTA-Diagnostic-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
