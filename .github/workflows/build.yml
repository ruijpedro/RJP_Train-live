name: RJP Train Live - Web + Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build WebApp
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-Web-V2.3.2
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build WebApp
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Apply RJP icon
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          cp -R native-icons/android/res/mipmap-* android/app/src/main/res/
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-V2.3.2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
