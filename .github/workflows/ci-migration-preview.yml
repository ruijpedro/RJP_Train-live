name: RJP Train Live 2 - migration preview (no OTA publication)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/v2/**"
      - "src/main.jsx"
      - "tests/v2-*.test.mjs"
      - ".github/workflows/ci-migration-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: Test original app + guarded new feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run original and new source tests
        run: npm test
      - name: Verify original build (migration disabled)
        env:
          VITE_RJP_V2_MIGRATION: '0'
        run: npm run build
      - name: Verify new engine in ORIGINAL app bundle (preview only)
        env:
          VITE_RJP_V2_MIGRATION: '1'
          VITE_APP_VERSION: '2.12.40'
        run: npm run build
      - name: Package preview-only OTA web bundle (do not publish manifest)
        run: |
          cd dist
          zip -q -r ../migration-preview-web.zip .
          cd ..
          unzip -t migration-preview-web.zip
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          file=pathlib.Path('migration-preview-web.zip')
          with zipfile.ZipFile(file) as z:
            assert 'index.html' in z.namelist()
          payload={'appId':'pt.rjp.trainlive','version':'2.12.40',
            'state':'CANDIDATE_ONLY_NOT_PUBLISHED',
            'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),
            'notes':'Motor CP/TML com adesão voluntária; modo original por defeito'}
          pathlib.Path('migration-preview-checksum.json').write_text(json.dumps(payload,indent=2)+'\n')
          print('Preview ZIP SHA-256:',payload['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Train-Live-migration-preview-NO-PUBLISH
          path: |
            migration-preview-web.zip
            migration-preview-checksum.json
          if-no-files-found: error
      - name: Verify Android identifier, push and OTA remain unchanged
        run: |
          node -e 'const c=require("./capacitor.config.json");if(c.appId!=="pt.rjp.trainlive")process.exit(1)'
          node -e 'const m=require("./ota/manifest.json");if(m.appId!=="pt.rjp.trainlive"||!/^\\d+\\.\\d+\\.\\d+$/.test(m.version))process.exit(1)'
